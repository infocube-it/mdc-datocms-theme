name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck and Vitest
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    # Keep the tag equal to the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --shm-size 1gb
    env:
      HOME: /tmp
      DATOCMS_PUBLISHED_CONTENT_CDA_TOKEN: ${{ secrets.DATOCMS_PUBLISHED_CONTENT_CDA_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
