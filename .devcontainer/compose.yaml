# Accessory services needed by later tickets (e.g. an SMTP test server for the
# contact form) are added here as siblings of `dev`. Never mount the Docker
# socket into `dev`: it would give the sandbox root access to the host.
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-Europe/Rome}
    command: sleep infinity
    cap_add:
      # Needed only by init-firewall.sh, which runs as root via a single sudo rule.
      - NET_ADMIN
      - NET_RAW
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
      CLAUDE_CONFIG_DIR: /home/node/.claude
      # Telemetry hosts are not in the firewall allowlist; don't try to reach them.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    volumes:
      - ..:/workspace:cached
      - commandhistory:/commandhistory
      - claude-config:/home/node/.claude

volumes:
  commandhistory:
  claude-config:
